name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Fader/**"
      - "Sources/**"
      - "Resources/**"
      - "scripts/**"
      - "Package.swift"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$RUNNER_TEMP/build.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1 > "$RUNNER_TEMP/sign-identity.txt"
          test -s "$RUNNER_TEMP/sign-identity.txt"

      - name: Build Fader.app
        run: |
          SIGN_IDENTITY="$(cat "$RUNNER_TEMP/sign-identity.txt")"
          UNIVERSAL=1 SIGN_IDENTITY="$SIGN_IDENTITY" scripts/build-app.sh

      - name: Notarize
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_API_ISSUER}" ]]; then
            echo "error: add the App Store Connect Issuer ID as the APPLE_API_ISSUER secret" >&2
            exit 1
          fi
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit build/Fader.zip \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple build/Fader.app
          ditto -c -k --sequesterRsrc --keepParent build/Fader.app build/Fader.zip

      - name: Check the zip
        run: |
          unzip -l build/Fader.zip | grep -q "Fader.app/Contents/MacOS/Fader"
          unzip -l build/Fader.zip | grep -q "Fader.app/Contents/Info.plist"
          ditto -x -k build/Fader.zip build/unpacked
          archs="$(lipo -archs build/unpacked/Fader.app/Contents/MacOS/Fader)"
          echo "architectures: $archs"
          echo "$archs" | grep -q arm64
          echo "$archs" | grep -q x86_64

      - name: Publish Fader.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<'EOF'
          Menu-bar volume and output splitter for macOS 14.2 or later.

          Unzip Fader.app, move it to /Applications, and open it. If macOS says the app cannot be opened, go to System Settings → Privacy & Security and choose Open Anyway. Then allow System Audio Recording.
          EOF
          )
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 build/Fader.zip --clobber
            gh release edit v0.1.0 --latest --notes "$notes"
          else
            gh release create v0.1.0 build/Fader.zip \
              --title "Fader 0.1.0" \
              --latest \
              --notes "$notes"
          fi
